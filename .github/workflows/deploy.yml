# main 有新 commit 就 build 並部署到 Cloudflare Workers（取代 Zeabur）
# 需要 repo secret：CLOUDFLARE_API_TOKEN（Edit Cloudflare Workers 權限）
# 站台 build 刻意不使用任何權杖（見 site/scripts/build.mjs），所以不需要 VITE_* secret
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 連續 push 時只保留最新一次，避免舊版本晚完成蓋掉新版本
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build:site

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d104f32eafd7b294ba1f74b731ffd1e0
