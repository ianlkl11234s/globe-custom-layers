<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Globe Custom Layers</title>
  <desc id="desc">An element-first field guide for globe rendering with Mapbox GL JS and Three.js.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#d4d4d4" stroke-width="2"/>
  <path d="M636 24V606" stroke="#e5e5e5" stroke-width="2"/>

  <image x="72" y="70" width="58" height="58" xlink:href="icon-512.png" preserveAspectRatio="xMidYMid meet"/>

  <g fill="#202020">
    <text x="72" y="177" font-family="Menlo, SFMono-Regular, monospace" font-size="20" font-weight="700" letter-spacing="2">MAPBOX GL JS / THREE.JS</text>
    <text x="72" y="286" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Globe Custom</text>
    <text x="72" y="364" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Layers</text>
    <text x="72" y="436" font-family="Arial, sans-serif" font-size="27">An element-first field guide for globe rendering.</text>
  </g>

  <g transform="translate(72 506)" font-family="Menlo, SFMono-Regular, monospace" font-size="17" font-weight="700" fill="#707070">
    <text x="0" y="0">POINTS</text>
    <circle cx="95" cy="-6" r="3" fill="#35c9c1"/>
    <text x="116" y="0">LINES</text>
    <circle cx="197" cy="-6" r="3" fill="#35c9c1"/>
    <text x="218" y="0">AREAS</text>
    <circle cx="304" cy="-6" r="3" fill="#35c9c1"/>
    <text x="325" y="0">CUSTOM EFFECTS</text>
  </g>

  <image x="712" y="105" width="380" height="380" xlink:href="icon-512.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="690" y="556" font-family="Menlo, SFMono-Regular, monospace" font-size="18" font-weight="700" letter-spacing="1" fill="#707070">GLOBE-CUSTOM-LAYERS</text>
</svg>
