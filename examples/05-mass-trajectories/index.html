<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mass trajectories</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #202020;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: rgba(32, 32, 32, 0.86);
        color: #ededed;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        min-width: 260px;
        backdrop-filter: blur(4px);
      }
      #hud h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #ededed;
      }
      #hud label {
        display: block;
        margin-top: 10px;
        color: #b0b0b0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #hud input[type="range"] {
        width: 100%;
      }
      #hud select {
        width: 100%;
        background: #292929;
        color: #ededed;
        border: 1px solid #444444;
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 13px;
      }

      #perf {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 1;
        background: rgba(32, 32, 32, 0.86);
        color: #ededed;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.6;
        min-width: 220px;
        backdrop-filter: blur(4px);
      }
      #perf h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #ededed;
      }
      #perf .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #perf .row span:last-child {
        font-variant-numeric: tabular-nums;
        color: #6cb6ff;
      }
      #perf .row.highlight span:last-child {
        color: #ffb86c;
        font-weight: 600;
      }

      #transport {
        position: absolute;
        bottom: 16px;
        left: 12px;
        right: 12px;
        z-index: 1;
        background: rgba(32, 32, 32, 0.86);
        color: #ededed;
        padding: 10px 14px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      #transport button {
        background: #292929;
        color: #ededed;
        border: 1px solid #444444;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        min-width: 64px;
      }
      #transport button:hover {
        background: #383838;
      }
      #transport .zoom-readout {
        min-width: 90px;
        text-align: right;
        color: #b0b0b0;
        font-variant-numeric: tabular-nums;
      }

      #token-warning {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        background: #202020;
        color: #ededed;
        text-align: center;
        padding: 24px;
      }
      #token-warning.visible {
        display: flex;
      }
      #token-warning .box {
        max-width: 480px;
      }
      #token-warning code {
        background: #383838;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #token-warning a {
        color: #6cb6ff;
      }
      html[data-theme="light"] body, html[data-theme="light"] #token-warning { background: #f4f8f7; color: #1f2d2e; }
      html[data-theme="light"] #hud, html[data-theme="light"] #perf, html[data-theme="light"] #transport { background: rgba(255, 255, 255, .9); color: #1f2d2e; box-shadow: 0 8px 24px rgba(20, 51, 51, .14); }
      html[data-theme="light"] #hud h1, html[data-theme="light"] #perf h1 { color: #123c3d; }
      html[data-theme="light"] #hud label, html[data-theme="light"] #transport .zoom-readout { color: #426568; }
      html[data-theme="light"] #hud select, html[data-theme="light"] #transport button { background: #edf6f5; color: #1f2d2e; border-color: #a8c9c7; }
      html[data-theme="light"] #perf .row span:last-child, html[data-theme="light"] #token-warning a { color: #007f86; }
      html[data-theme="light"] #perf .row.highlight span:last-child { color: #b45309; }
      html[data-theme="light"] #token-warning code { background: #dcebea; }
      html[data-theme="light"] #transport [data-i18n] { color: #426568 !important; }
      html[data-embed="true"] #hud, html[data-embed="true"] #perf { font-size: 14px; }
      html[data-embed="true"] #hud { width: min(calc(100% - 48px), 300px); min-width: 0; }
      html[data-embed="true"] #perf { top: auto; bottom: 62px; width: min(calc(100% - 48px), 300px); min-width: 0; }
      html[data-embed="true"] #hud h1, html[data-embed="true"] #perf h1 { font-size: 14px; }
      html[data-embed="true"] #hud label { font-size: 12px; }
      html[data-embed="true"] input { accent-color: #008b8b; }
      #hud-toggle { display: none; }
      @media (max-width: 700px) { html[data-embed="true"] #perf { display: none; } html[data-embed="true"] #hud { max-height: calc(100% - 84px); overflow: auto; } }
      @media (max-width: 520px) {
        html[data-embed="true"] #hud-toggle { display: block; position: static; margin: 0 0 8px auto; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: inherit; padding: 2px 6px; font: inherit; font-size: 12px; cursor: pointer; }
        html[data-embed="true"] #hud.hud-collapsed { width: auto; min-width: 0; }
        html[data-embed="true"] #hud.hud-collapsed > :not(h1):not(#hud-toggle) { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <h1 data-i18n="title">Mass trajectories</h1>
      <button id="hud-toggle" type="button" data-i18n="controls" aria-expanded="true">Controls</button>

      <label for="objects"><span data-i18n="objects">objects</span> <span id="objects-value"></span></label>
      <input id="objects" type="range" min="100" max="12000" step="100" value="1500" list="objects-ticks" />
      <datalist id="objects-ticks">
        <option value="500"></option>
        <option value="2000"></option>
        <option value="5000"></option>
        <option value="10000"></option>
      </datalist>

      <label for="strategy" data-i18n="eviction">eviction</label>
      <select id="strategy">
        <option value="heap" data-i18n="heap">min-heap (O(log capacity))</option>
        <option value="linear" data-i18n="linear">linear scan (O(capacity))</option>
      </select>

      <label for="palette" data-i18n="palette">palette</label>
      <select id="palette">
        <option value="multicolor" data-i18n="multicolor">multicolor</option>
        <option value="cool" data-i18n="cool">cool</option>
        <option value="warm" data-i18n="warm">warm</option>
      </select>

      <label for="speed"><span data-i18n="speed">speed ×</span> <span id="speed-value"></span></label>
      <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1" />

      <label for="opacity"><span data-i18n="opacity">opacity</span> <span id="opacity-value"></span></label>
      <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.9" />
    </div>

    <div id="perf">
      <h1 data-i18n="proof">Batching proof</h1>
      <div class="row"><span data-i18n="active">objects (active)</span><span id="stat-objects">--</span></div>
      <div class="row"><span data-i18n="slots">slots used</span><span id="stat-slots">--</span></div>
      <div class="row highlight"><span data-i18n="draws">draw calls</span><span id="stat-draws">--</span></div>
      <div class="row"><span data-i18n="perSecond">evictions / sec</span><span id="stat-evictions">--</span></div>
      <div class="row highlight"><span data-i18n="perUpdate">ms / update</span><span id="stat-ms">--</span></div>
      <div class="row"><span data-i18n="zoom">zoom</span><span id="zoom-value">--</span></div>
      <div class="row"><span data-i18n="projection">projection</span><span id="projection-value">--</span></div>
      <div class="row"><span data-i18n="transition">transition</span><span id="transition-value">--</span></div>
    </div>

    <div id="transport">
      <button id="play-pause" type="button">Pause</button>
      <span data-i18n="transport" style="color: #b0b0b0">Legs are generated procedurally and never stop -- there is no fixed-length timeline to scrub.</span>
    </div>

    <div id="token-warning">
      <div class="box">
        <p id="token-warning-message"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
