<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving trajectory</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #0b0d12;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: rgba(10, 12, 18, 0.78);
        color: #eee;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        min-width: 240px;
        backdrop-filter: blur(4px);
      }
      #hud h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #fff;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 4px 0;
      }
      #hud label {
        display: block;
        margin-top: 10px;
        color: #9aa4b2;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #hud input[type="range"] {
        width: 100%;
      }

      #transport {
        position: absolute;
        bottom: 16px;
        left: 12px;
        right: 12px;
        z-index: 1;
        background: rgba(10, 12, 18, 0.78);
        color: #eee;
        padding: 10px 14px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      #transport button {
        background: #1c2230;
        color: #eee;
        border: 1px solid #333c50;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        min-width: 64px;
      }
      #transport button:hover {
        background: #262e42;
      }
      #transport input[type="range"] {
        flex: 1;
      }
      #transport .time-readout {
        min-width: 90px;
        text-align: right;
        color: #9aa4b2;
        font-variant-numeric: tabular-nums;
      }

      #token-warning {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        color: #eee;
        text-align: center;
        padding: 24px;
      }
      #token-warning.visible {
        display: flex;
      }
      #token-warning .box {
        max-width: 480px;
      }
      #token-warning code {
        background: #1c2230;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #token-warning a {
        color: #6cb6ff;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <h1>Moving trajectory</h1>
      <div class="row"><span>zoom</span><span id="zoom-value">--</span></div>
      <div class="row"><span>projection</span><span id="projection-value">--</span></div>
      <div class="row"><span>transition</span><span id="transition-value">--</span></div>

      <label for="objects">objects <span id="objects-value"></span></label>
      <input id="objects" type="range" min="1" max="50" step="1" value="30" />

      <label for="trail-length">trail length <span id="trail-length-value"></span></label>
      <input id="trail-length" type="range" min="10" max="150" step="1" value="80" />

      <label for="speed">speed &times; <span id="speed-value"></span></label>
      <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1" />

      <label for="size-mul">point size &times; <span id="size-mul-value"></span></label>
      <input id="size-mul" type="range" min="0.2" max="3" step="0.05" value="1" />

      <label for="opacity">opacity <span id="opacity-value"></span></label>
      <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.9" />
    </div>

    <div id="transport">
      <button id="play-pause" type="button">Pause</button>
      <input id="scrubber" type="range" min="0" max="100" step="0.1" value="0" />
      <span class="time-readout" id="time-readout">0.0s / 30s</span>
    </div>

    <div id="token-warning">
      <div class="box">
        <p>
          No Mapbox access token found. Copy <code>.env.example</code> to <code>.env</code>,
          set <code>VITE_MAPBOX_TOKEN</code> to a token from your
          <a href="https://account.mapbox.com/access-tokens/" target="_blank" rel="noreferrer"
            >Mapbox account</a
          >, then restart <code>npm run dev</code>.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
