<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taiwan ADIZ · schematic wall</title>
    <style>
      :root { color: #e7e5dc; background: #07131c; font-family: Georgia, "Noto Serif TC", serif; }
      body, #map { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
      #hud { position: fixed; z-index: 2; top: 22px; left: 22px; max-width: 330px; padding: 18px 19px; border: 1px solid #dcae51; border-radius: 3px; background: rgb(7 19 28 / 89%); box-shadow: 0 18px 60px #0009; }
      h1 { margin: 0 0 7px; color: #f3c766; font-size: 20px; font-weight: 500; letter-spacing: .04em; }
      p { margin: 7px 0; font-size: 13px; line-height: 1.55; }
      .warning { border-top: 1px solid #6e5730; padding-top: 10px; color: #f0d5a0; }
      label { display: block; margin-top: 14px; color: #c9d5d6; font-size: 12px; letter-spacing: .04em; }
      input { width: 100%; accent-color: #e5ad44; }
      #height-value { color: #f3c766; font-variant-numeric: tabular-nums; }
      #token-warning { display: none; position: fixed; inset: 0; z-index: 3; place-items: center; padding: 30px; background: #07131cef; color: #f3c766; text-align: center; font-size: 16px; }
      #token-warning.visible { display: grid; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside id="hud">
      <h1>TAIWAN ADIZ / WALL</h1>
      <p>直立圍界示範：不是平面 fill。</p>
      <p class="warning"><strong>ADIZ 並非主權領空。</strong> 此輪廓為 illustrative / schematic boundary，非 AIP 精確邊界，也不適合作為航行、法律或作戰判讀。</p>
      <label for="height">SCHEMATIC DISPLAY HEIGHT · <span id="height-value"></span> km</label>
      <input id="height" type="range" min="80" max="600" value="280" step="10" />
      <p>高度只為視覺呈現；來源未提供可驗證 ceiling，故不把 unknown 當作 0 或真實上限。</p>
    </aside>
    <div id="token-warning">需要自己的 Mapbox token。<br />複製 <code>.env.example</code> 為 <code>.env</code>，填入 <code>VITE_MAPBOX_TOKEN</code>。</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
