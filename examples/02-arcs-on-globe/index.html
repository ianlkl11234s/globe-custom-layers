<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcs on globe</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #202020;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: rgba(32, 32, 32, 0.86);
        color: #ededed;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        min-width: 240px;
        max-width: 300px;
        backdrop-filter: blur(4px);
      }
      #hud h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #ededed;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 4px 0;
      }
      #hud label {
        display: block;
        margin-top: 10px;
        color: #b0b0b0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #hud input[type="range"] {
        width: 100%;
      }
      #hud .hint {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.45;
        color: #b0b0b0;
      }
      #hud .hint strong {
        color: #ffb454;
      }

      #token-warning {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        background: #202020;
        color: #ededed;
        text-align: center;
        padding: 24px;
      }
      #token-warning.visible {
        display: flex;
      }
      #token-warning .box {
        max-width: 480px;
      }
      #token-warning code {
        background: #383838;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #token-warning a {
        color: #6cb6ff;
      }
      html[data-theme="light"] body, html[data-theme="light"] #token-warning { background: #f4f8f7; color: #1f2d2e; }
      html[data-theme="light"] #hud { background: rgba(255, 255, 255, .9); color: #1f2d2e; box-shadow: 0 8px 24px rgba(20, 51, 51, .14); }
      html[data-theme="light"] #hud h1 { color: #123c3d; }
      html[data-theme="light"] #hud label, html[data-theme="light"] #hud .hint { color: #426568; }
      html[data-theme="light"] #hud .hint strong, html[data-theme="light"] #token-warning a { color: #007f86; }
      html[data-theme="light"] #token-warning code { background: #dcebea; }
      html[data-embed="true"] #hud { width: min(calc(100% - 48px), 300px); max-width: none; min-width: 0; font-size: 14px; }
      html[data-embed="true"] #hud h1 { font-size: 14px; }
      html[data-embed="true"] #hud label, html[data-embed="true"] #hud .hint { font-size: 12px; }
      html[data-embed="true"] input { accent-color: #008b8b; }
      #hud-toggle { display: none; }
      html[data-embed="true"] #hud-toggle { display: block; position: static; margin: 0 0 8px auto; border: 1px solid currentColor; border-radius: 999px; background: transparent; color: inherit; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
      html[data-embed="true"] #hud.hud-collapsed { width: auto; min-width: 0; display: grid; grid-template-columns: auto auto; align-items: center; gap: 12px; overflow: hidden; }
      html[data-embed="true"] #hud.hud-collapsed h1 { margin: 0; }
      html[data-embed="true"] #hud.hud-collapsed #hud-toggle { margin: 0; }
      html[data-embed="true"] #hud.hud-collapsed > :not(h1):not(#hud-toggle) { display: none; }
      @media (max-width: 520px) {
        html[data-embed="true"] #hud { max-height: calc(100% - 48px); overflow: auto; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <h1 data-i18n="title">Arcs on globe</h1>
      <button id="hud-toggle" type="button" data-i18n="controls" aria-expanded="true">Controls</button>
      <div class="row"><span data-i18n="zoom">zoom</span><span id="zoom-value">--</span></div>
      <div class="row"><span data-i18n="projection">projection</span><span id="projection-value">--</span></div>
      <div class="row"><span data-i18n="transition">transition</span><span id="transition-value">--</span></div>
      <div class="row"><span data-i18n="arcs">arcs</span><span id="arcs-value">--</span></div>
      <div class="row"><span data-i18n="vertices">vertices</span><span id="vertices-value">--</span></div>

      <label for="segments"><span data-i18n="segments">segments per arc</span> <span id="segments-value"></span></label>
      <input id="segments" type="range" min="2" max="128" step="1" value="24" />

      <label for="arc-height"><span data-i18n="height">arc height</span> <span id="arc-height-value"></span></label>
      <input id="arc-height" type="range" min="0" max="0.08" step="0.002" value="0.02" />

      <div class="hint" data-i18n="hint">
        Drag <strong>segments</strong> down to 2 to see the bug this example is
        about: an arc with only its two endpoints is a straight chord that
        cuts through the planet. 64+ hugs the sphere.
      </div>
    </div>

    <div id="token-warning">
      <div class="box">
        <p id="token-warning-message"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
